<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Java runtime architecture</title><desc id="desc">JDK contains tools and JRE, while JVM executes bytecode.</desc><rect width="900" height="480" rx="24" fill="#0d1a2c"/><text x="56" y="70" fill="#8de9dc" font-family="Arial" font-size="22" font-weight="700">JAVA RUNTIME MAP</text><rect x="56" y="120" width="788" height="274" rx="20" fill="#122238" stroke="#31506e"/><rect x="92" y="156" width="716" height="202" rx="16" fill="#0d1a2c" stroke="#51d5c5"/><text x="126" y="200" fill="#62dfcf" font-family="Arial" font-size="24" font-weight="700">JDK</text><text x="126" y="230" fill="#aab9ca" font-family="Arial" font-size="15">Compiler, tools, libraries</text><rect x="300" y="166" width="464" height="158" rx="14" fill="#162b42" stroke="#f4c56f"/><text x="332" y="210" fill="#f4c56f" font-family="Arial" font-size="22" font-weight="700">JRE</text><text x="332" y="238" fill="#aab9ca" font-family="Arial" font-size="15">Runtime libraries</text><rect x="510" y="178" width="218" height="118" rx="14" fill="#08111d" stroke="#8bb8ff"/><text x="550" y="222" fill="#8bb8ff" font-family="Arial" font-size="22" font-weight="700">JVM</text><text x="538" y="250" fill="#aab9ca" font-family="Arial" font-size="14">Executes bytecode</text><path d="M170 410v28M450 410v28M680 410v28" stroke="#51d5c5" stroke-width="3"/><text x="86" y="462" fill="#aab9ca" font-family="Arial" font-size="16">.java source</text><text x="380" y="462" fill="#aab9ca" font-family="Arial" font-size="16">bytecode</text><text x="650" y="462" fill="#aab9ca" font-family="Arial" font-size="16">machine execution</text></svg>