<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Spring Boot request flow</title><desc id="desc">A request flows through controller, service, repository and database.</desc><rect width="900" height="480" rx="24" fill="#0d1a2c"/><text x="52" y="58" fill="#8de9dc" font-family="Arial" font-size="22" font-weight="700">SPRING BOOT REQUEST FLOW</text><path d="M178 236h72M368 236h72M558 236h72" stroke="#51d5c5" stroke-width="4"/><path d="M238 226l14 10-14 10M428 226l14 10-14 10M618 226l14 10-14 10" fill="#51d5c5"/><g font-family="Arial"><rect x="52" y="170" width="126" height="132" rx="16" fill="#122238" stroke="#8bb8ff"/><text x="76" y="220" fill="#8bb8ff" font-size="18" font-weight="700">Request</text><text x="76" y="250" fill="#aab9ca" font-size="14">GET /users</text><rect x="242" y="170" width="126" height="132" rx="16" fill="#122238" stroke="#62dfcf"/><text x="264" y="220" fill="#62dfcf" font-size="18" font-weight="700">Controller</text><text x="272" y="250" fill="#aab9ca" font-size="14">routes API</text><rect x="432" y="170" width="126" height="132" rx="16" fill="#122238" stroke="#f4c56f"/><text x="458" y="220" fill="#f4c56f" font-size="18" font-weight="700">Service</text><text x="451" y="250" fill="#aab9ca" font-size="14">business logic</text><rect x="622" y="170" width="126" height="132" rx="16" fill="#122238" stroke="#f59ab1"/><text x="638" y="220" fill="#f59ab1" font-size="18" font-weight="700">Repository</text><text x="652" y="250" fill="#aab9ca" font-size="14">data access</text><rect x="350" y="360" width="200" height="62" rx="14" fill="#08111d" stroke="#71d9ed"/><text x="405" y="398" fill="#71d9ed" font-size="18" font-weight="700">Database</text><path d="M685 302v58H450" fill="none" stroke="#71d9ed" stroke-width="3" stroke-dasharray="7 7"/></g></svg>